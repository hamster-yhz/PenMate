spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/penmate
    username: postgres
    password: postgres

penmate:
  security:
    model-endpoint:
      allow-private: true
  bootstrap:
    admin:
      email: admin@penmate.local
      password: change-me-local
    chat:
      provider: openai-compatible
      base-url: http://localhost:11434/v1
      api-key: replace-me
      model-name: replace-with-chat-model
    embedding:
      provider: openai-compatible
      base-url: http://localhost:11434/v1
      api-key: replace-me
      model-name: replace-with-embedding-model
  test-datasource:
    url: jdbc:postgresql://localhost:5432/penmate_test
    username: postgres
    password: postgres
