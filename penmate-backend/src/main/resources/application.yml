server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:./penmate-backend/.env[.properties]
  application:
    name: penmate-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:penmate}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3s}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-strong-secret-key}
    issuer: ${JWT_ISSUER:penmate}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}

penmate:
  agent:
    story-bible:
      context-enabled: ${AGENT_STORY_BIBLE_CONTEXT_ENABLED:false}
  security:
    model-key-encryption-key-base64: ${MODEL_KEY_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  idempotency:
    key-prefix: ${IDEMPOTENCY_KEY_PREFIX:idempotency:}
    ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:86400}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:penmate}
    region: ${STORAGE_REGION:us-east-1}
    secure: ${STORAGE_SECURE:false}
    presign-expire-minutes: ${STORAGE_PRESIGN_EXPIRE_MINUTES:15}
  vector:
    provider: ${VECTOR_PROVIDER:milvus}
    endpoint: ${VECTOR_ENDPOINT:http://localhost:19530}
    api-key: ${VECTOR_API_KEY:}
    collection-prefix: ${VECTOR_COLLECTION_PREFIX:penmate_}
  bootstrap:
    reconcile: ${BOOTSTRAP_RECONCILE:false}
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    model:
      provider: ${BOOTSTRAP_MODEL_PROVIDER:}
      base-url: ${BOOTSTRAP_MODEL_BASE_URL:}
      api-key: ${BOOTSTRAP_MODEL_API_KEY:}
      model-name: ${BOOTSTRAP_MODEL_NAME:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    com.penmate.backend: info
