server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:./penmate-backend/.env[.properties]
  application:
    name: penmate-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:penmate}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3s}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-strong-secret-key}
    issuer: ${JWT_ISSUER:penmate}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}

penmate:
  agent:
    story-bible:
      context-enabled: ${AGENT_STORY_BIBLE_CONTEXT_ENABLED:false}
  security:
    model-key-encryption-key-base64: ${MODEL_KEY_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    model-endpoint:
      allow-private: ${MODEL_ENDPOINT_ALLOW_PRIVATE:false}
      admin-private-host-allowlist: ${MODEL_ENDPOINT_ADMIN_PRIVATE_HOST_ALLOWLIST:}
  rate-limit:
    key-secret: ${RATE_LIMIT_KEY_SECRET:}
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
  model:
    embedding-probe-connect-timeout: ${EMBEDDING_PROBE_CONNECT_TIMEOUT:5s}
    embedding-probe-response-timeout: ${EMBEDDING_PROBE_RESPONSE_TIMEOUT:15s}
  idempotency:
    key-prefix: ${IDEMPOTENCY_KEY_PREFIX:idempotency:}
    ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:86400}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:penmate}
    region: ${STORAGE_REGION:us-east-1}
    secure: ${STORAGE_SECURE:false}
    presign-expire-minutes: ${STORAGE_PRESIGN_EXPIRE_MINUTES:15}
  indexing:
    chunk-target-characters: ${INDEX_CHUNK_TARGET_CHARACTERS:800}
    chunk-overlap-characters: ${INDEX_CHUNK_OVERLAP_CHARACTERS:120}
    chunk-max-characters: ${INDEX_CHUNK_MAX_CHARACTERS:1200}
    embedding-batch-size: ${INDEX_EMBEDDING_BATCH_SIZE:32}
    embedding-batch-max-characters: ${INDEX_EMBEDDING_BATCH_MAX_CHARACTERS:30000}
    embedding-connect-timeout: ${INDEX_EMBEDDING_CONNECT_TIMEOUT:10s}
    embedding-response-timeout: ${INDEX_EMBEDDING_RESPONSE_TIMEOUT:60s}
    retrieval-candidates: ${INDEX_RETRIEVAL_CANDIDATES:30}
    retrieval-top-k: ${INDEX_RETRIEVAL_TOP_K:8}
    retrieval-max-per-source: ${INDEX_RETRIEVAL_MAX_PER_SOURCE:3}
    hnsw-ef-search: ${INDEX_HNSW_EF_SEARCH:100}
    max-upload-bytes: ${INDEX_MAX_UPLOAD_BYTES:10485760}
    max-chunks-per-source: ${INDEX_MAX_CHUNKS_PER_SOURCE:20000}
    max-chunks-per-project: ${INDEX_MAX_CHUNKS_PER_PROJECT:100000}
  bootstrap:
    reconcile: ${BOOTSTRAP_RECONCILE:false}
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    chat:
      provider: ${BOOTSTRAP_CHAT_PROVIDER:}
      base-url: ${BOOTSTRAP_CHAT_BASE_URL:}
      api-key: ${BOOTSTRAP_CHAT_API_KEY:}
      model-name: ${BOOTSTRAP_CHAT_MODEL_NAME:}
    embedding:
      provider: ${BOOTSTRAP_EMBEDDING_PROVIDER:}
      base-url: ${BOOTSTRAP_EMBEDDING_BASE_URL:}
      api-key: ${BOOTSTRAP_EMBEDDING_API_KEY:}
      model-name: ${BOOTSTRAP_EMBEDDING_MODEL_NAME:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
    com.penmate.backend: info
