services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-penmate}
      POSTGRES_USER: ${DB_USER:-penmate}
      POSTGRES_PASSWORD: ${DB_PASS:-penmate_dev_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: >
      sh -c 'if [ -n "$${REDIS_PASS}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASS}";
      else
      exec redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASS}\" ]; then redis-cli -a \"$${REDIS_PASS}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST:-/}
    ports:
      - "${RABBIT_PUBLIC_PORT:-5672}:5672"
      - "${RABBIT_MANAGEMENT_PUBLIC_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: penmate-backend/Dockerfile
    image: ${BACKEND_IMAGE:-penmate-backend:local}
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-penmate}
      DB_USER: ${DB_USER:-penmate}
      DB_PASS: ${DB_PASS:-penmate_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASS: ${REDIS_PASS:-}
      REDIS_DB: ${REDIS_DB:-0}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-32-char-secret}
      JWT_ISSUER: ${JWT_ISSUER:-penmate}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-penmate-compose-local-rate-limit-key}
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-false}
      MODEL_KEY_ENCRYPTION_KEY_BASE64: ${MODEL_KEY_ENCRYPTION_KEY_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MODEL_ENDPOINT_ALLOW_PRIVATE: ${MODEL_ENDPOINT_ALLOW_PRIVATE:-false}
      MODEL_ENDPOINT_ADMIN_PRIVATE_HOST_ALLOWLIST: ${MODEL_ENDPOINT_ADMIN_PRIVATE_HOST_ALLOWLIST:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_SECURE: ${STORAGE_SECURE:-true}
      BOOTSTRAP_RECONCILE: ${BOOTSTRAP_RECONCILE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@penmate.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-local}
      BOOTSTRAP_CHAT_PROVIDER: ${BOOTSTRAP_CHAT_PROVIDER:-}
      BOOTSTRAP_CHAT_BASE_URL: ${BOOTSTRAP_CHAT_BASE_URL:-}
      BOOTSTRAP_CHAT_API_KEY: ${BOOTSTRAP_CHAT_API_KEY:-}
      BOOTSTRAP_CHAT_MODEL_NAME: ${BOOTSTRAP_CHAT_MODEL_NAME:-}
      BOOTSTRAP_EMBEDDING_PROVIDER: ${BOOTSTRAP_EMBEDDING_PROVIDER:-}
      BOOTSTRAP_EMBEDDING_BASE_URL: ${BOOTSTRAP_EMBEDDING_BASE_URL:-}
      BOOTSTRAP_EMBEDDING_API_KEY: ${BOOTSTRAP_EMBEDDING_API_KEY:-}
      BOOTSTRAP_EMBEDDING_MODEL_NAME: ${BOOTSTRAP_EMBEDDING_MODEL_NAME:-}
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}
      JAVA_OPTS: ${JAVA_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLIC_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: penmate-frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:-/api}
        VITE_STORAGE_URL_PROTOCOL: ${VITE_STORAGE_URL_PROTOCOL:-http}
    image: ${FRONTEND_IMAGE:-penmate-frontend:local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLIC_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
