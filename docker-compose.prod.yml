services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: >
      sh -c 'if [ -n "$${REDIS_PASS}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASS}";
      else
      exec redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASS}\" ]; then redis-cli -a \"$${REDIS_PASS}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASS: ${REDIS_PASS:-}
      REDIS_DB: ${REDIS_DB:-0}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-penmate}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?RATE_LIMIT_KEY_SECRET is required}
      RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
      MODEL_KEY_ENCRYPTION_KEY_BASE64: ${MODEL_KEY_ENCRYPTION_KEY_BASE64}
      MODEL_ENDPOINT_ALLOW_PRIVATE: false
      MODEL_ENDPOINT_ADMIN_PRIVATE_HOST_ALLOWLIST: ${MODEL_ENDPOINT_ADMIN_PRIVATE_HOST_ALLOWLIST:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_SECURE: ${STORAGE_SECURE:-true}
      STORAGE_PRESIGN_EXPIRE_MINUTES: ${STORAGE_PRESIGN_EXPIRE_MINUTES:-15}
      BOOTSTRAP_RECONCILE: ${BOOTSTRAP_RECONCILE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_CHAT_PROVIDER: ${BOOTSTRAP_CHAT_PROVIDER:-}
      BOOTSTRAP_CHAT_BASE_URL: ${BOOTSTRAP_CHAT_BASE_URL:-}
      BOOTSTRAP_CHAT_API_KEY: ${BOOTSTRAP_CHAT_API_KEY:-}
      BOOTSTRAP_CHAT_MODEL_NAME: ${BOOTSTRAP_CHAT_MODEL_NAME:-}
      BOOTSTRAP_EMBEDDING_PROVIDER: ${BOOTSTRAP_EMBEDDING_PROVIDER:-}
      BOOTSTRAP_EMBEDDING_BASE_URL: ${BOOTSTRAP_EMBEDDING_BASE_URL:-}
      BOOTSTRAP_EMBEDDING_API_KEY: ${BOOTSTRAP_EMBEDDING_API_KEY:-}
      BOOTSTRAP_EMBEDDING_MODEL_NAME: ${BOOTSTRAP_EMBEDDING_MODEL_NAME:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}
      JAVA_OPTS: ${JAVA_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLIC_PORT:-8443}:8443"
    volumes:
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
