name: tdd-quality-gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penmate-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run backend tests + coverage gate
        run: mvn -B verify

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: penmate-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run frontend coverage gate
        run: npm run test:coverage

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend jar for image
        working-directory: penmate-backend
        run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: penmate-backend/Dockerfile
          push: false
          tags: penmate-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: penmate-frontend/Dockerfile
          push: false
          tags: penmate-frontend:ci
          build-args: |
            VITE_APP_API_BASE_URL=/api
            VITE_STORAGE_URL_PROTOCOL=http
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
