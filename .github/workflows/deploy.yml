name: deploy

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/penmate-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/penmate-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_code: ${{ steps.filter.outputs.backend_code }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      frontend_code: ${{ steps.filter.outputs.frontend_code }}
      frontend_image: ${{ steps.filter.outputs.frontend_image }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_code:
              - 'penmate-backend/src/**'
              - 'penmate-backend/pom.xml'
            backend_image:
              - 'penmate-backend/Dockerfile'
              - '.dockerignore'
            frontend_code:
              - 'penmate-frontend/src/**'
              - 'penmate-frontend/e2e/**'
              - 'penmate-frontend/public/**'
              - 'penmate-frontend/package.json'
              - 'penmate-frontend/package-lock.json'
              - 'penmate-frontend/index.html'
              - 'penmate-frontend/tsconfig*.json'
              - 'penmate-frontend/vite.config.*'
              - 'penmate-frontend/playwright.config.*'
              - 'penmate-frontend/eslint.config.*'
              - 'penmate-frontend/scripts/**'
            frontend_image:
              - 'penmate-frontend/Dockerfile'
              - 'penmate-frontend/nginx.conf'
              - '.dockerignore'
            deployment:
              - 'docker-compose.prod.yml'
              - '.env.example'
              - 'scripts/deploy-remote.sh'

  backend-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_code == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penmate-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B -Pci-postgresql-tests verify

  frontend-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_code == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: penmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: penmate-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test:run
      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run frontend browser smoke tests
        run: npm run test:e2e -- --project=chromium
      - name: Build frontend
        run: npm run build
      - name: Check frontend bundle budget
        run: npm run budget
      - name: Audit production dependencies
        run: npm run audit:prod

  deployment-validate:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell script
        run: bash -n scripts/deploy-remote.sh
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet

  build-and-push:
    needs: [changes, backend-test, frontend-test]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.backend_code == 'true' ||
       needs.changes.outputs.backend_image == 'true' ||
       needs.changes.outputs.frontend_code == 'true' ||
       needs.changes.outputs.frontend_image == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_code == 'true' || needs.changes.outputs.backend_image == 'true' }}
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend jar for image
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_code == 'true' || needs.changes.outputs.backend_image == 'true' }}
        working-directory: penmate-backend
        run: mvn -B -Dmaven.test.skip=true package

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          BUILD_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_code == 'true' || needs.changes.outputs.backend_image == 'true' }}
          BUILD_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_code == 'true' || needs.changes.outputs.frontend_image == 'true' }}
        run: |
          if [ "$BUILD_BACKEND" = "true" ]; then
            backend_image="${REGISTRY}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "backend_image=${backend_image,,}" >> "$GITHUB_OUTPUT"
            echo "backend_latest=${REGISTRY}/${BACKEND_IMAGE_NAME}:latest" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$BUILD_FRONTEND" = "true" ]; then
            frontend_image="${REGISTRY}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "frontend_image=${frontend_image,,}" >> "$GITHUB_OUTPUT"
            echo "frontend_latest=${REGISTRY}/${FRONTEND_IMAGE_NAME}:latest" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend_code == 'true' || needs.changes.outputs.backend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: penmate-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_latest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_code == 'true' || needs.changes.outputs.frontend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: penmate-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.meta.outputs.frontend_latest }}
          build-args: |
            VITE_APP_API_BASE_URL=/api
            VITE_STORAGE_URL_PROTOCOL=http
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [changes, backend-test, frontend-test, deployment-validate, build-and-push]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.backend_code == 'true' ||
       needs.changes.outputs.backend_image == 'true' ||
       needs.changes.outputs.frontend_code == 'true' ||
       needs.changes.outputs.frontend_image == 'true' ||
       needs.changes.outputs.deployment == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped') &&
      (needs.deployment-validate.result == 'success' || needs.deployment-validate.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment bundle
        shell: bash
        run: |
          mkdir -p deploy-bundle/scripts
          cp docker-compose.prod.yml .env.example deploy-bundle/
          cp scripts/deploy-remote.sh deploy-bundle/scripts/
          tar -czf deploy-bundle.tgz -C deploy-bundle .

      - name: Upload deployment bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          deploy_path="${DEPLOY_PATH:-/opt/penmate}"
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "mkdir -p '${deploy_path}'"
          sshpass -p "${SSH_PASSWORD}" scp -o StrictHostKeyChecking=accept-new deploy-bundle.tgz "${SSH_USER}@${SSH_HOST}:${deploy_path}/deploy-bundle.tgz"
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "cd '${deploy_path}' && tar -xzf deploy-bundle.tgz && chmod +x scripts/*.sh"

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          deploy_path="${DEPLOY_PATH:-/opt/penmate}"
          ghcr_username="${GHCR_USERNAME}"
          backend_image="${BACKEND_IMAGE}"
          frontend_image="${FRONTEND_IMAGE}"
          echo "CI backend_image=${backend_image:-<empty>}"
          echo "CI frontend_image=${frontend_image:-<empty>}"
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "DEPLOY_PATH='${deploy_path}' bash -s" <<EOF
          set -euo pipefail
          cd "\$DEPLOY_PATH"
          if [ -n '${backend_image}' ]; then export BACKEND_IMAGE='${backend_image}'; fi
          if [ -n '${frontend_image}' ]; then export FRONTEND_IMAGE='${frontend_image}'; fi
          ./scripts/deploy-remote.sh
          EOF
